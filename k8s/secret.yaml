apiVersion: v1
kind: Secret
metadata:
  name: gestion-stagiaires-secrets
  namespace: gestion-stagiaires-stb
type: Opaque
data:
  # Values are base64 encoded. Generate each one with:
  #   echo -n "the-real-value" | base64
  #
  # ⚠️ The placeholders below are for a LOCAL dev cluster only. For anything resembling a real
  # deployment, create this Secret from a proper secret manager instead of committing it:
  #   kubectl create secret generic gestion-stagiaires-secrets -n gestion-stagiaires-stb \
  #     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
  #     --from-literal=DATABASE_PASSWORD='…' \
  #     --from-literal=RABBITMQ_PASSWORD='…' \
  #     --from-literal=SMTP_HOST='smtp.gmail.com' \
  #     --from-literal=SMTP_USERNAME='…' \
  #     --from-literal=SMTP_PASSWORD='…'
  #
  # JWT_SECRET must be ≥32 bytes (HS256) and identical across the gateway, auth-service and the
  # four .NET services, or every authenticated request fails.
  DATABASE_PASSWORD: cG9zdGdyZXM=          # postgres
  JWT_SECRET: c2dvbWVyLXN3YXBwZXItc3VwZXItc2VjcmV0
  RABBITMQ_PASSWORD: c3VwZXJzZWNyZXQ=      # supersecret

  # ---- SMTP (override these in the cluster; do not commit real credentials) ----
  SMTP_HOST: bWFpbGhvZw==                  # mailhog
  SMTP_USERNAME: ""                        # empty
  SMTP_PASSWORD: ""                        # empty
