# HorizontalPodAutoscalers — scales the gateway and the busiest services on CPU pressure.
#
# Requires metrics-server in the cluster:
#   minikube addons enable metrics-server
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Without metrics-server the HPAs are created but stay at minReplicas and report
# "unable to fetch metrics" (kubectl describe hpa -n gestion-stagiaires-stb).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: gestion-stagiaires-stb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 9
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      # Scale down slowly so a burst does not cause flapping.
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stagiaire-service-hpa
  namespace: gestion-stagiaires-stb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stagiaire-service
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: convention-service-hpa
  namespace: gestion-stagiaires-stb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: convention-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
