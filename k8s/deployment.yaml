            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gestion-stagiaires-stb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/frontend:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
# ========== STORAGE ==========
# These services run with replicas > 1, so the volumes MUST be ReadWriteMany: each replica mounts
# the same files (a CV uploaded to one pod must be downloadable from another). This requires a
# storage class that supports RWX (NFS, CephFS, EFS, Azure Files…). On a single-node dev cluster
# without an RWX class, scale these two deployments back to replicas: 1 — see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stagiaire-storage-pvc
  namespace: gestion-stagiaires-stb
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: convention-storage-pvc
  namespace: gestion-stagiaires-stb
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi
