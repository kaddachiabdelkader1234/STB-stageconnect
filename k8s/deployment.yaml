# Kubernetes Deployments — Gestion des Stagiaires STB
#
# Replica sizing follows the MODERNIZATION_PROMPT Part C guidance: 2–3 replicas for the gateway
# and the busiest .NET services, 1 for the stateless registries. HorizontalPodAutoscalers live in
# hpa.yaml (requires metrics-server in the cluster).
#
# NOTE: PostgreSQL / MySQL / RabbitMQ are expected to be provided by the cluster or a managed
# service and are therefore NOT declared here — only the application services are.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: gestion-stagiaires-stb
spec:
  # Service registry — a single instance keeps the registry consistent; it is not in the request path.
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/eureka-server:latest
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: gestion-stagiaires-stb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/config-server:latest
        ports:
        - containerPort: 8888
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: EUREKA_DEFAULT_ZONE
          value: "http://eureka-server:8761/eureka/"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gestion-stagiaires-stb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/auth-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/smartek_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: DATABASE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: JWT_SECRET
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gestion-stagiaires-stb
spec:
  # Busiest service — every request passes through it, and it also hosts the /hub/** WebSocket route.
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/api-gateway:latest
        ports:
        # The gateway binds 18080 (Backend/api-gateway/.../application.yml) — NOT the Spring default 8080.
        - containerPort: 18080
        env:
        - name: EUREKA_DEFAULT_ZONE
          value: "http://eureka-server:8761/eureka/"
        - name: CONFIG_SERVER_URL
          value: "http://config-server:8888"
        - name: GATEWAY_ALLOWED_ORIGINS
          value: "https://stb.local"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: JWT_SECRET
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 18080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 18080
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
---
# ========== .NET SERVICES ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagiaire-service
  namespace: gestion-stagiaires-stb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stagiaire-service
  template:
    metadata:
      labels:
        app: stagiaire-service
    spec:
      containers:
      - name: stagiaire-service
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/stagiaire-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gestion-stagiaires-config
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Port=5432;Database=stagiaire_service_db;Username=postgres;Password=postgres;Maximum Pool Size=20;Minimum Pool Size=5;Connection Idle Lifetime=300"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: JWT_SECRET
        - name: Storage__RootPath
          value: "/app/storage"
        volumeMounts:
        - name: stagiaire-storage
          mountPath: /app/storage
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
      volumes:
      - name: stagiaire-storage
        persistentVolumeClaim:
          claimName: stagiaire-storage-pvc
---
