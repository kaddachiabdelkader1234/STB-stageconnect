apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: gestion-stagiaires-stb
spec:
  # Also hosts the SignalR hub — needs ≥2 replicas, but note that group membership is per-pod:
  # see k8s/README.md for the Redis backplane caveat before scaling this beyond 2.
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ghcr.io/kaddachiabdelkader1234/gestion-des-stagiere/notification-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gestion-stagiaires-config
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Port=5432;Database=notification_service_db;Username=postgres;Password=postgres;Maximum Pool Size=20;Minimum Pool Size=5;Connection Idle Lifetime=300"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: JWT_SECRET
        - name: Smtp__Host
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: SMTP_HOST
        - name: Smtp__Username
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: SMTP_USERNAME
        - name: Smtp__Password
          valueFrom:
            secretKeyRef:
              name: gestion-stagiaires-secrets
              key: SMTP_PASSWORD
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
