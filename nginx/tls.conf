# TLS termination for local/dev and single-node deployments.
#
# Enabled with:
#   bash scripts/generate-dev-certs.sh
#   docker compose --profile tls up -d
#
# It terminates HTTPS on 443, redirects 80 → 443, and forwards:
#   /api/**       → api-gateway:18080
#   /hub/**       → api-gateway:18080   (SignalR WebSocket upgrade)
#   /actuator/**  → api-gateway:18080
#   /**           → frontend:80         (the Angular SPA)
#
# ⚠️ Because the SPA and the API are served from the same origin here, the Angular build must
# target that origin, not the raw gateway port — otherwise the browser blocks the call as mixed
# content (an https:// page cannot fetch http://localhost:18080). Set, in
# Frontend/angular-app/src/environments/environment.prod.ts:
#     apiUrl: 'https://localhost/api/v1'
#     authApiUrl: 'https://localhost/api/v1/auth'
# and the gateway's GATEWAY_ALLOWED_ORIGINS to https://localhost (see .env.example).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $http_x_forwarded_for';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # WebSocket upgrade support (SignalR /hub/**).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_gateway {
        server api-gateway:18080;
    }

    upstream frontend_app {
        server frontend:80;
    }

    # ---- HTTP → HTTPS ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CV / document uploads are capped at 10 MB in the services.
        client_max_body_size 15m;

        location /api/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR — long-lived WebSocket connections.
        location /hub/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /actuator/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
