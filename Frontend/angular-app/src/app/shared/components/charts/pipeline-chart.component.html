<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
  <div *ngIf="title" class="text-lg font-bold text-gray-800 mb-4">{{ title }}</div>
  <div *ngIf="!hasData" class="text-gray-400 text-sm py-8 text-center">Aucune donnée disponible</div>

  <div *ngIf="hasData" class="space-y-3">
    <div *ngFor="let stage of data; let i = index" class="flex items-center gap-4">
      <span class="w-32 sm:w-40 text-sm font-medium text-gray-700 text-right truncate">{{ stage.label }}</span>
      <div class="flex-1 bg-gray-100 rounded-full h-6 overflow-hidden relative">
        <div class="h-full rounded-full bg-gradient-to-r from-primary to-accent flex items-center justify-end px-3 transition-all duration-700"
             [style.width.%]="total > 0 ? (stage.value / total) * 100 : 0">
          <span *ngIf="(stage.value / total) * 100 > 10" class="text-xs text-white font-semibold">{{ stage.value }}</span>
        </div>
      </div>
      <span *ngIf="total > 0" class="w-12 text-right text-xs text-gray-500">
        {{ Math.round((stage.value / total) * 100) }}%
      </span>
    </div>
  </div>
</div>
