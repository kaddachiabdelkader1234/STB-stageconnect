<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
  <div *ngIf="title" class="text-lg font-bold text-gray-800 mb-4">{{ title }}</div>
  <div *ngIf="!hasData" class="text-gray-400 text-sm py-8 text-center">Aucune donnée disponible</div>

  <div *ngIf="hasData" class="flex flex-col sm:flex-row items-center gap-6">
    <!-- SVG Donut -->
    <div class="relative flex-shrink-0">
      <svg width="140" height="140" viewBox="0 0 100 100" class="-rotate-90">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#f1f5f9" stroke-width="14" />
        <circle *ngFor="let slice of data; let i = index"
                cx="50" cy="50" r="40" fill="none"
                [attr.stroke]="slice.color"
                stroke-width="14"
                [attr.stroke-dasharray]="getSvgCoordinates(i).strokeDasharray"
                [attr.stroke-dashoffset]="getSvgCoordinates(i).strokeDashoffset"
                stroke-linecap="round"
                class="transition-all duration-500 hover:opacity-80 cursor-pointer" />
      </svg>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="text-center">
          <span class="block text-2xl font-bold text-gray-800">{{ total }}</span>
          <span class="block text-xs text-gray-500">Total</span>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex-1 space-y-2">
      <div *ngFor="let slice of data" class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full" [style.background-color]="slice.color"></span>
          <span class="text-sm text-gray-600">{{ slice.label }}</span>
        </div>
        <span class="text-sm font-semibold text-gray-800">{{ slice.value }}</span>
      </div>
    </div>
  </div>
</div>
