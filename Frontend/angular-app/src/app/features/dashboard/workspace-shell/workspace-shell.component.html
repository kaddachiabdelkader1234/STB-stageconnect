<div class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-50 dark:from-[#0b1222] dark:via-[#0b1222] dark:to-[#0f172a]">
  <!-- ================= Top bar ================= -->
  <header class="sticky top-0 z-[9000] border-b border-gray-200/70 dark:border-gray-800 bg-white/80 dark:bg-[#0b1222]/80 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16 gap-4">

        <!-- Brand -->
        <a [routerLink]="['/espace']" class="flex items-center gap-2.5 flex-shrink-0 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-primary-light flex items-center justify-center shadow-lg shadow-primary/25 group-hover:shadow-primary/40 transition-shadow">
            <span class="text-white font-bold text-base">S</span>
          </div>
          <div class="hidden sm:block leading-tight">
            <p class="font-bold text-gray-900 dark:text-gray-100 text-sm">STB</p>
            <p class="text-[10px] text-gray-400 -mt-0.5">{{ roleLabel }}</p>
          </div>
        </a>

        <!-- Pill navigation (centered) -->
        <nav class="hidden md:flex items-center gap-1 bg-gray-100/80 dark:bg-gray-800/60 rounded-2xl p-1"
             aria-label="Navigation principale">
          <a *ngFor="let item of navigation()"
             [routerLink]="item.route"
             class="px-3.5 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition-all duration-200"
             [class]="isActive(item.route, item.exact)
               ? 'bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-md'
               : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'">
            <span class="material-icons text-[17px]">{{ item.icon }}</span>
            {{ item.label }}
          </a>
        </nav>

        <!-- Right cluster -->
        <div class="flex items-center gap-2 flex-shrink-0">
          <!-- Notification bell -->
          <button (click)="toggleBell()"
                  class="relative w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                  aria-label="Notifications">
            <span class="material-icons text-[21px]">notifications_none</span>
            <span *ngIf="unreadCount() > 0"
                  class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 inline-flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold ring-2 ring-white dark:ring-[#0b1222] animate-pulse">
              {{ unreadCount() > 9 ? '9+' : unreadCount() }}
            </span>
          </button>

          <!-- Theme toggle -->
          <button (click)="toggleTheme()"
                  class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                  aria-label="Changer le thème">
            <span class="material-icons text-[21px]">{{ themeService.isDark ? 'light_mode' : 'dark_mode' }}</span>
          </button>

          <!-- Account -->
          <div class="relative">
            <button (click)="toggleAccount()"
                    class="flex items-center gap-2 pl-1 pr-2.5 py-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-light flex items-center justify-center text-white text-sm font-bold shadow-md shadow-primary/25">
                {{ initial }}
              </div>
              <span class="hidden lg:block text-sm font-semibold text-gray-700 dark:text-gray-200">{{ firstName }}</span>
              <span class="material-icons text-gray-400 text-base">expand_more</span>
            </button>

            <!-- Dropdown -->
            <div *ngIf="accountOpen()"
                 class="absolute right-0 mt-2 w-56 bg-white dark:bg-[#0f172a] rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 py-2 z-50 animate-scale-in"
                 (click)="toggleAccount()">
              <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-800">
                <p class="text-sm font-bold text-gray-900 dark:text-gray-100">{{ firstName }}</p>
                <p class="text-xs text-gray-400">{{ profile?.email }}</p>
                <span class="inline-block mt-1.5 px-2 py-0.5 rounded-full bg-primary/10 text-primary dark:text-sky-300 text-[10px] font-bold uppercase tracking-wide">
                  {{ roleLabel }}
                </span>
              </div>
              <a routerLink="/espace/profil"
                 class="w-full text-left px-4 py-2.5 mt-1 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center gap-2.5 transition">
                <span class="material-icons text-lg">person</span>
                Mon profil
              </a>
              <button (click)="logout()"
                      class="w-full text-left px-4 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10 flex items-center gap-2.5 transition">
                <span class="material-icons text-lg">logout</span>
                Se déconnecter
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile pill nav -->
      <nav class="md:hidden flex items-center gap-1.5 overflow-x-auto pb-3 -mt-1 scrollbar-none" aria-label="Navigation mobile">
        <a *ngFor="let item of navigation()"
           [routerLink]="item.route"
           class="flex-shrink-0 px-3.5 py-2 rounded-xl text-[13px] font-medium flex items-center gap-1.5 transition"
           [class]="isActive(item.route, item.exact)
             ? 'bg-primary text-white shadow-md'
             : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'">
          <span class="material-icons text-base">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      </nav>
    </div>
  </header>

  <!-- ================= Content ================= -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- ================= Overlays ================= -->
  <app-notification-center></app-notification-center>
  <app-notification></app-notification>
</div>
