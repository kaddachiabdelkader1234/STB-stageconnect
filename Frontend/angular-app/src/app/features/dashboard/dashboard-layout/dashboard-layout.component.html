<div class="min-h-screen bg-[#F4F6FB] dark:bg-[#070D1A]">
  <div class="dashboard-content">
    <app-sidebar></app-sidebar>

    <!-- xl:ml-68.5 clears the fixed 264px console sidebar on wide screens; without it the main
         content starts at x=0 and hides underneath the sidebar -->
    <main class="flex-1 p-6 lg:p-8 overflow-auto min-h-screen xl:ml-68.5">
      <!-- Admin Top Bar cluster: Notification bell on the side -->
      <div class="flex items-center justify-end mb-4">
        <button (click)="toggleNotifications()"
                class="relative w-10 h-10 rounded-xl bg-white dark:bg-[#0B1222] shadow-sm border border-gray-200/80 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-white/5 transition group"
                aria-label="Notifications"
                title="Notifications">
          <span class="material-icons text-[21px] text-gray-500 dark:text-gray-400 group-hover:text-[#C8A951] transition">notifications_none</span>
          <span *ngIf="(unread() ?? 0) > 0"
                class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 inline-flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold ring-2 ring-white dark:ring-[#070D1A] animate-pulse">
            {{ (unread() ?? 0) > 9 ? '9+' : unread() }}
          </span>
        </button>
      </div>

      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Shared overlays: slide-over notification panel + toast popups -->
  <app-notification-center></app-notification-center>
  <app-notification></app-notification>
</div>
