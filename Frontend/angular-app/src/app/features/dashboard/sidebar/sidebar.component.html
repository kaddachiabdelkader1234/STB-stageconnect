<aside class="console-sidebar fixed inset-y-0 left-0 z-[990] w-[264px] flex flex-col
              bg-[#0B1222] border-r border-white/5 shadow-2xl">
  <!-- ================= Brand ================= -->
  <div class="flex items-center gap-3 px-5 h-[72px] flex-shrink-0">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#C8A951] to-[#B8983D] flex items-center justify-center shadow-lg shadow-[#C8A951]/20">
      <span class="text-[#0B1222] font-bold text-lg">S</span>
    </div>
    <div class="leading-tight">
      <p class="text-white font-bold text-[15px]">STB <span class="text-[#C8A951]">StageConnect</span></p>
      <p class="text-[10px] text-slate-500 uppercase tracking-widest">Administration</p>
    </div>
  </div>



  <!-- ================= Grouped nav ================= -->
  <nav class="flex-1 overflow-y-auto px-4 pb-4 space-y-6 sidebar-scroll" aria-label="Navigation admin">
    <div *ngFor="let group of groups">
      <p *ngIf="group.title" class="px-3 mb-2 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-600">
        {{ group.title }}
      </p>

      <ul class="space-y-1">
        <li *ngFor="let item of group.items">
          <a [routerLink]="[item.route]"
             routerLinkActive="nav-active"
             class="nav-item group">
            <span class="material-icons text-[19px] nav-icon">{{ item.icon }}</span>
            <span class="flex-1">{{ item.label }}</span>
            <span class="nav-dot"></span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ================= User + actions ================= -->
  <div class="flex-shrink-0 px-4 pb-5 pt-3 border-t border-white/5">
    <!-- Theme toggle -->
    <button (click)="toggleTheme()"
            class="w-full flex items-center justify-center gap-2 py-2.5 mb-3 rounded-xl text-[13px] font-medium
                   text-slate-300 bg-white/[0.04] hover:bg-white/[0.08] border border-white/5 transition">
      <span class="material-icons text-[17px]">{{ themeService.isDark ? 'light_mode' : 'dark_mode' }}</span>
      {{ themeService.isDark ? 'Mode clair' : 'Mode sombre' }}
    </button>

    <!-- User card -->
    <div class="flex items-center gap-3 px-2 mb-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#C8A951] to-[#B8983D] flex items-center justify-center flex-shrink-0">
        <span class="text-[#0B1222] font-bold text-sm">{{ getUserInitial() }}</span>
      </div>
      <div class="min-w-0">
        <p class="text-sm font-semibold text-slate-100 truncate">{{ currentUser?.firstName || 'Admin' }}</p>
        <p class="text-[11px] text-slate-500 truncate">{{ formatRole(currentUser?.role) }}</p>
      </div>
    </div>

    <!-- Mon profil -->
    <a routerLink="/admin/profil"
       class="w-full flex items-center justify-center gap-2 py-2 mb-2 rounded-xl text-[13px] font-medium
              text-slate-300 bg-white/[0.04] hover:bg-white/[0.08] border border-white/5 transition">
      <span class="material-icons text-[17px]">person</span>
      Mon profil
    </a>

    <!-- Logout -->
    <button (click)="logout()"
            class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-[13px] font-medium
                   text-red-400 bg-red-500/10 hover:bg-red-500/20 border border-red-500/10 transition">
      <span class="material-icons text-[17px]">logout</span>
      Déconnexion
    </button>
  </div>
</aside>
